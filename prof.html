<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/prof.css">
</head>
<body>
<main class="screen" aria-label="Profile">

  <header class="header">
    <button class="back" id="backBtn" aria-label="Назад">
      
      <img src="./public/images/profile/icons/back.svg" alt="">
    </button>
    <h1 class="title">Profile</h1>
    <button class="bell" id="bellBtn" aria-label="Уведомления">
      
      <img src="./public/images/profile/icons/bell.svg" alt="">
      
    </button>
  </header>

  <section class="sheet">
    <div class="avatar">
  <img id="avatar" src="public/images/profile/avatar.jpg" alt="John Smith">
</div>
    <h2 class="name">John Smith</h2>
    <p class="uid"><b>ID:</b> 25030024</p>

    <nav class="menu" aria-label="Profile menu">
      <a class="item" href="#" data-action="edit">
        <span class="ico c1"><img src="./public/images/profile/icons/user.svg" alt=""></span>
        <span class="label">Edit Profile</span>
      </a>
      <a class="item" href="#" data-action="security">
        <span class="ico c2"><img src="./public/images/profile/icons/shield.svg" alt=""></span>
        <span class="label">Security</span>
      </a>
      <a class="item" href="#" data-action="settings">
        <span class="ico c3"><img src="./public/images/profile/icons/settings.svg" alt=""></span>
        <span class="label">Setting</span>
      </a>
      <a class="item" href="#" data-action="help">
        <span class="ico c4"><img src="./public/images/profile/icons/help.svg" alt=""></span>
        <span class="label">Help</span>
      </a>
      <a class="item" href="#" data-action="logout">
        <span class="ico c5"><img src="./public/images/profile/icons/logout.svg" alt=""></span>
        <span class="label">Logout</span>
      </a>
    </nav>
  </section>

  <footer class="tabbar" id="tabbar">
    <button class="tab" data-tab="home" aria-label="Home">
      <img src="./public/icons/Vector-7.svg" alt="">
    </button>
    <button class="tab" data-tab="analytics" aria-label="Analytics">
      <img src="./public/icons/Vector-8.svg" alt="">
    </button>
    <button class="tab" data-tab="transfer" aria-label="Transfer">
      <img src="./public/icons/Vector-9.svg" alt="">
    </button>
    <button class="tab" data-tab="cards" aria-label="Cards">
      <img src="./public/icons/Vector-10.svg" alt="">
    </button>
    <button class="tab active" data-tab="profile" aria-label="Profile">
      <img src="./public/icons/Vector-11.svg" alt="">
    </button>
  </footer>

</main>
<script src="./JS/prof.js"></script>
</body>
</html>

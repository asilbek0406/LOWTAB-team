<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/prof.css">
</head>
<body>
<main class="screen" aria-label="Profile">

  <header class="header">
    <button class="back" id="backBtn" aria-label="Назад">
      <!-- 19 x 16 -->
      <svg width="19" height="16" viewBox="0 0 19 16" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8H1.5M8 1.5 1.5 8 8 14.5"/></svg>
    </button>
    <h1 class="title">Profile</h1>
    <button class="bell" id="bellBtn" aria-label="Уведомления">
      <!-- 30 x 30 -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B3B3A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9Z"/><path d="M10 19.5a2.2 2.2 0 0 0 4 0"/></svg>
      <span class="bell-dot"></span>
    </button>
  </header>

  <section class="sheet">
    <img class="avatar" id="avatar" src="avatar.jpg" alt="John Smith" width="117" height="117">
    <h2 class="name">John Smith</h2>
    <p class="uid"><b>ID:</b> 25030024</p>

    <nav class="menu" aria-label="Profile menu">
      <a class="item" href="#" data-action="edit">
        <span class="ico c1"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="9.5" r="4"/><path d="M6.5 23.5c0-3.6 3-6 8.5-6s8.5 2.4 8.5 6c0 .6-.4 1-1 1h-15c-.6 0-1-.4-1-1Z"/></svg></span>
        <span class="label">Edit Profile</span>
      </a>
      <a class="item" href="#" data-action="security">
        <span class="ico c2"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 7 8v6.5c0 5 3.4 8.4 8 10 4.6-1.6 8-5 8-10V8l-8-3Z"/><path d="m11.5 14.8 2.5 2.5 4.5-4.8"/></svg></span>
        <span class="label">Security</span>
      </a>
      <a class="item" href="#" data-action="settings">
        <span class="ico c3"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="15" r="3.5"/><path d="M13 4.5h4l.7 2.7 1.8.8 2.4-1.4 2.8 2.8-1.4 2.4.8 1.8 2.7.7v4l-2.7.7-.8 1.8 1.4 2.4-2.8 2.8-2.4-1.4-1.8.8-.7 2.7h-4l-.7-2.7-1.8-.8-2.4 1.4-2.8-2.8 1.4-2.4-.8-1.8-2.7-.7v-4l2.7-.7.8-1.8-1.4-2.4 2.8-2.8 2.4 1.4 1.8-.8.7-2.7Z" transform="translate(0 -.5) scale(.98)"/></svg></span>
        <span class="label">Setting</span>
      </a>
      <a class="item" href="#" data-action="help">
        <span class="ico c4"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 16v-2a9.5 9.5 0 0 1 19 0v2"/><rect x="4" y="14.5" width="3.5" height="6" rx="1.5"/><rect x="22.5" y="14.5" width="3.5" height="6" rx="1.5"/><path d="M13 12.2a2.2 2.2 0 1 1 3 2c-.7.4-1 .9-1 1.6M15 18.6v.1"/><path d="M24.5 20.5c0 2.5-2 3.5-5 3.5"/></svg></span>
        <span class="label">Help</span>
      </a>
      <a class="item" href="#" data-action="logout">
        <span class="ico c5"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6H9a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3"/><path d="M12 6v-.5M12 24v.5M13.5 15h11M20.5 11l4 4-4 4"/></svg></span>
        <span class="label">Logout</span>
      </a>
    </nav>
  </section>

  <footer class="tabbar" id="tabbar">
    <button class="tab" data-tab="home" aria-label="Home">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#1B3B3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 14 4l9.5 8.5V23a1 1 0 0 1-1 1h-17a1 1 0 0 1-1-1V12.5Z"/><path d="M11 24v-6h6v6"/></svg>
    </button>
    <button class="tab" data-tab="analytics" aria-label="Analytics">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#1B3B3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="13" r="9.5"/><path d="m20 20 5 5M9.5 16.5v-3M12 16.5v-6M14.5 16.5v-4M17 16.5v-5"/></svg>
    </button>
    <button class="tab" data-tab="transfer" aria-label="Transfer">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#1B3B3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10h17l-4-4M23 18H6l4 4"/></svg>
    </button>
    <button class="tab" data-tab="cards" aria-label="Cards">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#1B3B3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14 5 10 5-10 5-10-5 10-5Z"/><path d="m4 14 10 5 10-5M4 18.5l10 5 10-5"/></svg>
    </button>
    <button class="tab active" data-tab="profile" aria-label="Profile">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#1B3B3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="9" r="4.5"/><path d="M5.5 24c0-4.2 3.2-6.5 8.5-6.5s8.5 2.3 8.5 6.5c0 .6-.4 1-1 1h-15c-.6 0-1-.4-1-1Z"/></svg>
    </button>
  </footer>

</main>
<script src="./JS/prof.js"></script>
</body>
</html>
